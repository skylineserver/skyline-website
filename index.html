<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SKYLINE || স্কাইলাইন — Chill • Friendly • Non-Toxic</title>

  <meta name="google-site-verification" content="mldBqel4se71WnPRMmACbJQMQdpmw0osPwkvii7wvic">

  <meta name="description" content="SKYLINE || স্কাইলাইন is a chill, friendly and welcoming Discord community founded by ARIAN.">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", Arial, sans-serif;
      background: #03040a;
      color: #fff;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: fixed;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 10%,
          rgba(88, 101, 242, .15),
          transparent 35%
        ),
        radial-gradient(
          circle at 10% 80%,
          rgba(139, 92, 246, .10),
          transparent 30%
        ),
        linear-gradient(
          180deg,
          #060817 0%,
          #03040a 100%
        );
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .25;
      animation: float 12s ease-in-out infinite alternate;
    }

    .orb.one {
      width: 350px;
      height: 350px;
      background: #5865f2;
      top: -130px;
      left: -100px;
    }

    .orb.two {
      width: 320px;
      height: 320px;
      background: #8b5cf6;
      right: -120px;
      top: 30%;
      animation-delay: -4s;
    }

    .orb.three {
      width: 280px;
      height: 280px;
      background: #3b82f6;
      left: 25%;
      bottom: -150px;
      animation-delay: -7s;
    }

    @keyframes float {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }

      to {
        transform: translate3d(45px, -35px, 0) scale(1.12);
      }
    }

    /* Stars */

    .stars,
    .stars::before,
    .stars::after {
      position: absolute;
      inset: 0;
      content: "";
      background-image:
        radial-gradient(
          circle,
          rgba(255,255,255,.8) 1px,
          transparent 1.5px
        ),
        radial-gradient(
          circle,
          rgba(142,161,255,.7) 1px,
          transparent 1.5px
        );
      background-size:
        120px 120px,
        190px 190px;
      background-position:
        20px 30px,
        70px 90px;
      opacity: .17;
      animation: starsMove 35s linear infinite;
    }

    .stars::before {
      opacity: .10;
      transform: scale(1.4);
      animation-duration: 50s;
    }

    .stars::after {
      opacity: .07;
      transform: scale(1.8);
      animation-duration: 65s;
    }

    @keyframes starsMove {
      to {
        background-position:
          350px 550px,
          -350px -450px;
      }
    }

    /* =========================
       NAVBAR
    ========================= */

    nav {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: min(1120px, 92%);
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 14px 18px;

      border: 1px solid rgba(255,255,255,.09);
      border-radius: 18px;

      background: rgba(5,7,17,.70);
      backdrop-filter: blur(22px);

      box-shadow:
        0 15px 60px rgba(0,0,0,.35);
    }

    .logo {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .5px;
      white-space: nowrap;
    }

    .logo span {
      color: #8ea1ff;
    }

    .links {
      display: flex;
      gap: 5px;
    }

    .links a {
      color: #9297aa;
      font-size: 13px;
      font-weight: 600;

      padding: 9px 13px;
      border-radius: 10px;

      transition: .3s ease;
    }

    .links a:hover {
      color: #fff;
      background: rgba(255,255,255,.07);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding:
        150px 20px
        100px;

      position: relative;
    }

    .hero-content {
      width: 100%;
      max-width: 950px;

      display: flex;
      flex-direction: column;
      align-items: center;

      animation: heroIn 1.1s ease both;
    }

    @keyframes heroIn {
      from {
        opacity: 0;
        transform: translateY(35px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Avatar */

    .avatar-wrap {
      position: relative;

      width: 150px;
      height: 150px;

      margin-bottom: 30px;
    }

    .avatar-wrap::before {
      content: "";

      position: absolute;
      inset: -9px;

      border-radius: 30px;

      background:
        conic-gradient(
          from 0deg,
          #5865f2,
          #8b5cf6,
          #60a5fa,
          #5865f2
        );

      filter: blur(8px);

      opacity: .75;

      animation: spin 7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .server-avatar {
      position: relative;

      width: 150px;
      height: 150px;

      object-fit: cover;

      border-radius: 26px;

      border:
        2px solid
        rgba(255,255,255,.18);

      box-shadow:
        0
